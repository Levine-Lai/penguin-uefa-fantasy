<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020b2d" />
    <title>企鹅欧冠 Fantasy 联赛</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./dashboard.css?v=20261021-1" />
    <link rel="stylesheet" href="./refinements.css?v=20261015-1" />
  </head>
  <body>
    <main class="league-shell">
      <header class="site-header">
        <div class="header-copy">
          <div>
            <p class="season-label">2026/27 UEFA CHAMPIONS LEAGUE</p>
            <h1>企鹅欧冠 Fantasy 联赛对阵</h1>
          </div>
        </div>
        <div class="region-switch" role="group" aria-label="赛区切换">
          <button class="region-button is-active" type="button" data-region="arctic">Shuo🐧北极赛区</button>
          <button class="region-button" type="button" data-region="antarctic">小红书关注Acidboy🐧南极赛区</button>
        </div>
      </header>

      <nav class="main-nav" aria-label="联赛页面">
        <button class="nav-button is-active" type="button" data-view="matches">对阵详情</button>
        <button class="nav-button" type="button" data-view="standings">实时积分榜</button>
        <button class="nav-button" type="button" data-view="fdr">FDR</button>
        <button class="nav-button" type="button" data-view="groups">分组详情</button>
      </nav>

      <section class="page-view is-active" id="matchesView" data-view-panel="matches">
        <div class="section-heading">
          <div><p class="section-kicker" id="matchesRegionLabel"></p><h2>对阵详情</h2></div>
        </div>
        <div class="round-tabs" id="roundTabs" role="tablist" aria-label="比赛轮次"></div>
        <div class="match-grid" id="matchGrid"></div>
      </section>

      <section class="page-view" id="fdrView" data-view-panel="fdr" hidden>
        <div class="section-heading fdr-heading">
          <div><p class="section-kicker" id="fdrRegionLabel"></p><h2>赛程难度 FDR</h2></div>
          <div class="fdr-key" aria-label="难度颜色说明">
            <span><i data-pot="1"></i>Pot 1</span><span><i data-pot="2"></i>Pot 2</span><span><i data-pot="3"></i>Pot 3</span><span><i data-pot="4"></i>Pot 4</span>
          </div>
        </div>
        <div class="fdr-scroll" tabindex="0" aria-label="赛程难度表，可横向滚动">
          <table class="fdr-table">
            <thead id="fdrHead"></thead>
            <tbody id="fdrBody"></tbody>
          </table>
        </div>
      </section>

      <section class="page-view" id="standingsView" data-view-panel="standings" hidden>
        <div class="section-heading">
          <div><p class="section-kicker" id="standingsRegionLabel"></p><h2>实时积分榜</h2></div>
        </div>
        <div class="table-card">
          <table class="standings-table">
            <thead id="standingsHead"></thead>
            <tbody id="standingsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="page-view" id="groupsView" data-view-panel="groups" hidden>
        <div class="section-heading">
          <div><p class="section-kicker" id="groupsRegionLabel"></p><h2>分组详情</h2></div>
        </div>
        <div class="pot-grid" id="potGrid"></div>
      </section>
    </main>

    <div class="modal-backdrop" id="matchModal" hidden>
      <section class="match-modal" role="dialog" aria-modal="true" aria-labelledby="modalMatchTitle">
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭">×</button>
        <div id="modalContent"></div>
      </section>
    </div>

    <script src="./ucl-app.js?v=20260907-data"></script>
    <script src="./league-data.js?v=20260909-2"></script>
    <script src="./uefa-live-data.js?v=1792652209987"></script>
    <script src="./dashboard.js?v=20261022-1"></script>
  </body>
</html>
