name: Update UEFA Fantasy Data

on:
  schedule:
    # 01:00 UTC = 09:00 Beijing. The script skips mornings without overnight matches.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-uefa-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh after UEFA match nights
        if: github.event_name == 'schedule'
        env:
          UEFA_SCHEDULED_RUN: "1"
          UEFA_COOKIE: ${{ secrets.UEFA_COOKIE }}
        run: |
          if node fetch-uefa-snapshot.mjs; then
            exit 0
          fi
          echo "Refresh failed; retrying once in 15 minutes."
          sleep 900
          node fetch-uefa-snapshot.mjs

      - name: Refresh manually
        if: github.event_name == 'workflow_dispatch'
        env:
          UEFA_COOKIE: ${{ secrets.UEFA_COOKIE }}
        run: node fetch-uefa-snapshot.mjs

      - name: Commit updated snapshot
        run: |
          git add uefa-live-data.js index.html commentary.html
          if git diff --cached --quiet; then
            echo "No UEFA data update was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update UEFA Fantasy data"
          git pull --rebase origin main
          git push

      - name: Report refresh result
        if: always()
        run: |
          echo "### UEFA refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}. Match-night refresh: 09:00 Beijing (01:00 UTC); retry once 15 minutes after failure." >> "$GITHUB_STEP_SUMMARY"
          node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("uefa-live-data.js","utf8").replace(/^window\.PENGUIN_UEFA_SNAPSHOT\s*=\s*/,"").replace(/;\s*$/,""));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`\nPublished snapshot: GD${s.matchday}, fetched ${s.generatedAt}\n`);'
