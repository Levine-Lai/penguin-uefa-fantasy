name: Update UEFA Fantasy Data

on:
  schedule:
    # 00:30 UTC = 08:30 Asia/Shanghai. GitHub schedules always use UTC.
    # The later entries are fallbacks for occasional delayed/missed GitHub cron runs.
    # The fetcher records the refresh date, so at most one run changes data each day.
    - cron: "30,45 0 * * *"
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-uefa-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh after a scheduled UEFA fixture night
        if: github.event_name == 'schedule'
        env:
          UEFA_SCHEDULED_RUN: "1"
        run: node fetch-uefa-snapshot.mjs

      - name: Refresh manually
        if: github.event_name == 'workflow_dispatch'
        run: node fetch-uefa-snapshot.mjs

      - name: Commit updated snapshot
        run: |
          git add uefa-live-data.js
          if git diff --cached --quiet; then
            echo "No UEFA data update was needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update UEFA Fantasy data"
          git push
